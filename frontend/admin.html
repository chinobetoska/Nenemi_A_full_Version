<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin - Nenemi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="pagina-contenedor">
        <header class="titulo-nenemia">
            <h1>Panel De Administración Nenemi</h1>
        </header>

        <section class="contenedor">
            <h2>Nuevo Destino</h2>
            <form id="form-destino">
                <div class="elemento">
                    <label>Nombre</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="elemento">
                    <label>Estado</label>
                    <input type="text" id="estado" required>
                </div>
                <div class="elemento">
                    <label>Descripción</label>
                    <input type="text" id="descripcion" required>
                </div>
                <div class="elemento">
                    <label>URL Foto</label>
                    <input type="url" id="foto" required>
                </div>
                <input type="submit" value="Guardar" class="btn-enviar">
            </form>
            <p id="mensaje"></p>
        </section>

        <h2 class="seccion-titulo">Gestión de Destinos</h2>
        <div id="lista-admin" class="destinos-grid"></div>
    </div>
    <script src="admin.js"></script>
</body>
</html>
