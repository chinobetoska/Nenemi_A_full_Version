<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administrador - Nenemi-a</title>
    <link rel="stylesheet" href="style.css"> </head>
<body>
    <h1>Agregar Nuevo Destino</h1>
    <form id="form-destino" style="max-width: 400px; margin: auto; display: flex; flex-direction: column; gap: 10px;">
        <input type="text" id="nombre" placeholder="Nombre del lugar" required>
        <input type="text" id="estado" placeholder="Estado (ej. Chiapas)" required>
        <textarea id="descripcion" placeholder="Descripción breve" required></textarea>
        <input type="url" id="foto" placeholder="Link de la imagen (URL)" required>
        <button type="submit" style="background: green; color: white; padding: 10px; cursor: pointer;">Guardar Destino</button>
    </form>

    <p id="mensaje"></p>
    <br>
    <a href="index.html">Ver página principal</a>

    <script>
        const formulario = document.getElementById('form-destino');
        formulario.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nuevoDato = {
                nombre: document.getElementById('nombre').value,
                estado: document.getElementById('estado').value,
                descripcion: document.getElementById('descripcion').value,
                foto: document.getElementById('foto').value
            };

            const res = await fetch('https://nenemi-a-full-version.onrender.com/api/destinos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nuevoDato)
            });

            if(res.ok) {
                document.getElementById('mensaje').innerText = "✅ ¡Destino agregado!";
                formulario.reset();
            } else {
                document.getElementById('mensaje').innerText = "❌ Error al guardar";
            }
        });
    </script>
</body>
</html>
